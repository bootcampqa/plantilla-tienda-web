<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | QA Market</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- MENÚ (igual en todas las páginas) -->
  <header class="cabecera">
     <p class="logo">QA Market</p>
    <nav class="menu">
      <a href="index.html">Inicio</a>
      <a href="tienda.html">Tienda</a>
      <a href="contacto.html" class="activo">Contacto</a>
    </nav>
  </header>

  <main class="contenido">
    <section class="seccion">
      <h1 class="titulo">Contacto</h1>
    </section>

    <!-- FORMULARIO -->
    <section class="seccion">
      <h2 class="subtitulo">Envíanos un mensaje</h2>
      <form class="formulario" action="#">

        <label class="campo-label" for="email">Email</label>
        <input class="campo" type="email" id="email" placeholder="tu@email.com">

        <label class="campo-label" for="mensaje">Mensaje</label>
        <textarea class="campo" id="mensaje" rows="5" placeholder="Escribe tu mensaje..."></textarea>

        <button class="boton" type="submit">Enviar mensaje</button>
      </form>
    </section>
  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="pie">
    <p>© 2026 QA Experience</p>
  </footer>

</body>
</html>
